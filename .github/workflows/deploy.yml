name: CI/CD to AWS

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stworzenie pliku environment.ts
        run: |
          mkdir -p src/environments
          cat <<EOF > src/environments/environment.ts
          export const environment = {
            production: true,
            apiUrl: '${{ secrets.AWS_LAMBDA_URL }}'
          };
          EOF

      - name: Logowanie do AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Budowanie aplikacji
        run: |
          npm install
          npm run build

      - name: Wgranie na S3
        run: aws s3 sync dist/OrderMenuO/browser s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Czyszczenie cache CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"
