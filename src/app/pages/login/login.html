<body>
<div class="form-container">
  <form id="login-form">
    <h2>Zaloguj się</h2>
    <div class="form-group">
      <label>Login</label>
      <input type="text" id="username" name="username" required [(ngModel)]="log">
    </div>
    <div class="form-group">
      <label>Hasło</label>
      <input type="password" id="password" name="password" required [(ngModel)]="password">
    </div>
    <div class="button-div">
      <button class="login-btn" (click)="login()">Zaloguj</button>
    </div>
  </form>

</div>
</body>
